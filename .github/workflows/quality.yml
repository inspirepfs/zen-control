name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Environment contract
        run: python3 scripts/env_validate.py --no-local
      - name: Compile Python
        run: python3 -m py_compile app/*.py telemetry/ingest/*.py scripts/*.py
      - name: UX validation
        run: python3 scripts/ux_validate.py
      - name: Supply-chain contract
        run: python3 scripts/supply_chain_validate.py
      - name: PWA JavaScript syntax
        run: node --check app/static/pwa.js
      - name: Public-source audit
        run: python3 scripts/public_release_audit.py
      - name: Unit and hostile tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Compose parse
        run: docker compose --env-file .env.example config >/dev/null
  supply-chain:
    runs-on: ubuntu-latest
    needs: source-quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python audit tooling
        run: python3 -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Python dependency vulnerability report
        shell: bash
        run: |
          mkdir -p supply-chain-artifacts
          set +e
          python3 -m pip_audit \
            -r requirements.txt \
            --progress-spinner off \
            --format json \
            --output supply-chain-artifacts/pip-audit.json
          rc=$?
          set -e
          printf '%s\n' "$rc" > supply-chain-artifacts/pip-audit.exit
          if [ "$rc" -ne 0 ]; then
            echo "::error::pip-audit reported vulnerable or unauditable Python dependencies"
          fi
      - name: Build supply-chain image
        run: |
          docker build --pull -t zen-control:supply-chain .
          docker image inspect --format '{{.Id}}' zen-control:supply-chain > supply-chain-artifacts/image-id.txt
          sha256sum requirements.txt Dockerfile > supply-chain-artifacts/build-inputs.sha256
      - name: Container vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: zen-control:supply-chain
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: supply-chain-artifacts/trivy-vulnerabilities.json
      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: zen-control:supply-chain
          scanners: vuln
          list-all-pkgs: true
          exit-code: '0'
          format: cyclonedx
          output: supply-chain-artifacts/zen-control-image.cdx.json
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: supply-chain-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce Python dependency audit
        shell: bash
        run: |
          rc="$(cat supply-chain-artifacts/pip-audit.exit)"
          if [ "$rc" -ne 0 ]; then
            echo "Python dependency audit failed with status $rc" >&2
            exit "$rc"
          fi
          echo "PYTHON DEPENDENCY AUDIT: PASS"
      - name: Enforce fixed HIGH/CRITICAL container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: zen-control:supply-chain
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  runtime-container-smoke:
    runs-on: ubuntu-latest
    needs: source-quality
    env:
      ADMIN_USER: ci-parent
      ADMIN_PASSWORD: replace-with-ci-runtime-password
      ZEN_RUNTIME_SMOKE_PASSWORD: replace-with-ci-runtime-password
      SESSION_SECRET: test-secret-ci-session-0123456789abcdef0123456789abcdef
      OTP_ENCRYPTION_KEY: test-secret-ci-otp-0123456789abcdef0123456789abcdef
      MIKROTIK_HOST: 127.0.0.1
      MIKROTIK_PORT: '8728'
      MIKROTIK_USER: ci-router
      MIKROTIK_PASSWORD: replace-with-ci-router-password
      TELEMETRY_DB_PASSWORD: replace-with-ci-telemetry-password
      PIHOLE_PASSWORD: replace-with-ci-pihole-password
      ZEN_LOCAL_HOST: localhost
      ZEN_LAN_BIND_IP: 127.0.0.1
      ZEN_LAN_CIDRS: 127.0.0.0/8
      CADDY_CF_API_TOKEN: test-secret-ci-unused-dns-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Start telemetry database
        run: |
          docker compose --env-file .env.example up -d telemetry-db
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mikrotik-telemetry-db 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              echo "telemetry-db is healthy"
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "telemetry-db became unhealthy" >&2
              docker compose --env-file .env.example logs --no-color --tail=100 telemetry-db || true
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "telemetry-db did not become healthy within 60 seconds" >&2
              docker compose --env-file .env.example logs --no-color --tail=100 telemetry-db || true
              exit 1
            fi
            sleep 1
          done
      - name: Build and start application container
        run: docker compose --env-file .env.example up -d --build mikrotik-control
      - name: Runtime and rendered-HTML acceptance
        run: >-
          python3 scripts/runtime_acceptance.py
          --base-url http://127.0.0.1:8080
          --expect-version 0.59.0
          --admin-user "$ADMIN_USER"
          --admin-password-env ZEN_RUNTIME_SMOKE_PASSWORD
          --startup-timeout 60
      - name: Application logs
        if: always()
        run: docker compose --env-file .env.example logs --no-color --tail=250 mikrotik-control || true
      - name: Telemetry database logs
        if: always()
        run: docker compose --env-file .env.example logs --no-color --tail=100 telemetry-db || true
      - name: Tear down runtime smoke
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans || true

  fresh-install-commissioning:
    runs-on: ubuntu-latest
    needs: source-quality
    env:
      ADMIN_USER: ci-fresh-parent
      ADMIN_PASSWORD: replace-with-ci-fresh-password
      ZEN_RUNTIME_SMOKE_PASSWORD: replace-with-ci-fresh-password
      SESSION_SECRET: test-secret-ci-fresh-session-0123456789abcdef0123456789abcdef
      OTP_ENCRYPTION_KEY: test-secret-ci-fresh-otp-0123456789abcdef0123456789abcdef
      MIKROTIK_HOST: 127.0.0.1
      MIKROTIK_PORT: '8728'
      MIKROTIK_USER: ci-fresh-router
      MIKROTIK_PASSWORD: replace-with-ci-fresh-router-password
      TELEMETRY_DB_PASSWORD: replace-with-ci-fresh-telemetry-password
      PIHOLE_PASSWORD: replace-with-ci-fresh-pihole-password
      ZEN_LOCAL_HOST: localhost
      ZEN_LAN_BIND_IP: 127.0.0.1
      ZEN_LAN_CIDRS: 127.0.0.0/8
      CADDY_CF_API_TOKEN: test-secret-ci-fresh-unused-dns-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fresh-install commissioning acceptance
        run: >-
          python3 scripts/fresh_install_acceptance.py
          --project-name zen-fresh-install-ci
          --confirm-destroy-project zen-fresh-install-ci
          --env-file .env.example
          --compose-file docker-compose.yml
          --base-url http://127.0.0.1:8080
          --expect-version 0.59.0
          --admin-user "$ADMIN_USER"
          --admin-password-env ZEN_RUNTIME_SMOKE_PASSWORD
          --cycles 2
          --startup-timeout 90
      - name: Fresh-install application logs
        if: always()
        run: docker compose -p zen-fresh-install-ci --env-file .env.example -f docker-compose.yml logs --no-color --tail=250 mikrotik-control || true
      - name: Fresh-install telemetry database logs
        if: always()
        run: docker compose -p zen-fresh-install-ci --env-file .env.example -f docker-compose.yml logs --no-color --tail=100 telemetry-db || true
      - name: Tear down fresh-install acceptance
        if: always()
        run: docker compose -p zen-fresh-install-ci --env-file .env.example -f docker-compose.yml down -v --remove-orphans || true
